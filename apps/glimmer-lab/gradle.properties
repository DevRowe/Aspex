# JVM args sized for a single-module Compose build.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
android.useAndroidX=true

# Hub connection defaults baked into BuildConfig.
# 10.0.2.2 is the emulator's alias for the host machine's loopback, where the
# Hub binds by default (127.0.0.1:4317).
# Override per developer in ~/.gradle/gradle.properties or with -P flags:
#   ./gradlew :app:assembleDebug -PaspexHubUrl=http://10.0.2.2:4317 -PaspexHubToken=<token>
# The token lives in ~/.aspex/config.json (hubToken) on the machine running the Hub.
aspexHubUrl=http://10.0.2.2:4317
aspexHubToken=
